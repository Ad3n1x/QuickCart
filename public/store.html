<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QuickCart Store</title><style>body{margin:0;font-family:Inter,system-ui,sans-serif;background:#f5f7f6;color:#12392d}.wrap{max-width:980px;margin:auto;padding:32px 20px}.hero,.card{background:#fff;border:1px solid #dfe8e3;border-radius:20px;padding:24px;margin-bottom:18px}.hero{background:#12392d;color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.product{display:flex;flex-direction:column;gap:10px}.emoji{font-size:44px}.price{font-size:20px;font-weight:800}.btn{border:0;border-radius:12px;padding:12px 16px;background:#12392d;color:#fff;font-weight:700;cursor:pointer}.cart{position:sticky;bottom:15px}.muted{opacity:.7}input{padding:12px;border:1px solid #ccd8d2;border-radius:10px;width:100%;box-sizing:border-box;margin:5px 0 10px}</style></head><body><div class="wrap" id="app"><div class="card">Loading store…</div></div><script>const API='https://quickcart-api-f7x7.onrender.com';const q=new URLSearchParams(location.search);const slug=q.get('slug');const money=n=>new Intl.NumberFormat('en-NG',{style:'currency',currency:'NGN',maximumFractionDigits:0}).format(n);let data,cart=[];async function load(){if(!slug)throw Error('Missing store slug');const r=await fetch(API+'/api/storefront/'+encodeURIComponent(slug));const d=await r.json();if(!r.ok)throw Error(d.error||'Store not found');data=d;render()}function render(){const s=data.store;document.title=s.storeName+' · QuickCart';document.getElementById('app').innerHTML='<section class="hero"><h1>'+esc(s.storeName)+'</h1><p>'+esc(s.tagline||'Shop with us')+'</p></section><section class="grid">'+data.products.map((p,i)=>'<article class="card product"><div class="emoji">'+esc(p.emoji||'🛍️')+'</div><strong>'+esc(p.name)+'</strong><span class="muted">'+esc(p.description||'')+'</span><span class="price">'+money(p.price)+'</span><button class="btn" onclick="add('+i+')">Add to cart</button></article>').join('')+'</section><section class="card cart"><h2>Cart</h2><div id="items">'+(cart.length?cart.map(x=>'<p>'+esc(x.name)+' × '+x.qty+' — '+money(x.price*x.qty)+'</p>').join(''):'<p class="muted">Your cart is empty.</p>')+'</div>'+(cart.length?'<p><strong>Total: '+money(cart.reduce((a,x)=>a+x.price*x.qty,0))+'</strong></p><input id="name" placeholder="Your name"><input id="phone" placeholder="WhatsApp number"><input id="address" placeholder="Delivery address"><button class="btn" onclick="checkout()">Order on WhatsApp</button>':'')+'</section>'}function add(i){const p=data.products[i],x=cart.find(x=>x.id===p.id);if(x)x.qty++;else cart.push({...p,qty:1});render()}function checkout(){const name=document.getElementById('name').value.trim(),phone=document.getElementById('phone').value.trim(),address=document.getElementById('address').value.trim();if(!name||!phone||!address)return alert('Please enter your name, WhatsApp number and address.');const total=cart.reduce((a,x)=>a+x.price*x.qty,0);const msg='Hello '+data.store.storeName+', I want to place an order:%0A%0A'+cart.map(x=>x.name+' x '+x.qty+' — '+money(x.price*x.qty)).join('%0A')+'%0A%0ATotal: '+money(total)+'%0AName: '+encodeURIComponent(name)+'%0APhone: '+encodeURIComponent(phone)+'%0AAddress: '+encodeURIComponent(address);const wa=String(data.store.vendorPhone||'').replace(/\D/g,'');if(!wa)return alert('This store has not added a WhatsApp number yet.');location.href='https://wa.me/'+wa+'?text='+msg}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}load().catch(e=>document.getElementById('app').innerHTML='<section class="card"><h2>Store unavailable</h2><p>'+esc(e.message)+'</p><button class="btn" onclick="location.reload()">Try again</button></section>');</script></body></html>
