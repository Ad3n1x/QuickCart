<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QuickCart QR Code</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f7f6;font-family:Inter,system-ui,sans-serif;color:#12392d}.card{background:#fff;border:1px solid #dfe8e3;border-radius:24px;padding:30px;text-align:center;max-width:420px;margin:20px}.qr{width:280px;height:280px;object-fit:contain;border:12px solid #fff;border-radius:16px;box-shadow:0 8px 30px #12392d22}.btn{border:0;border-radius:12px;padding:12px 18px;background:#12392d;color:#fff;font-weight:700;cursor:pointer;margin:6px}</style></head><body><main class="card"><h1>Scan to shop</h1><p>Share this QR code with your customers.</p><div id="qr">Creating QR code…</div><p><button class="btn" onclick="downloadQr()">Save QR</button><button class="btn" onclick="window.print()">Print</button></p></main><script>const url=new URLSearchParams(location.search).get('url');const encoded=encodeURIComponent(url||location.origin);const src='https://quickchart.io/qr?text='+encoded+'&size=500&margin=2';document.getElementById('qr').innerHTML='<img id="img" class="qr" src="'+src+'" alt="QuickCart store QR code">';function downloadQr(){const a=document.createElement('a');a.href=src;a.download='quickcart-store-qr.png';a.target='_blank';a.click()}</script></body></html>
