<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#12392d"><title>QuickCart QR Code</title><style>:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#102c22;background:#f4f7f5}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(180deg,#edf5f1,#f8faf9)}.card{width:min(460px,calc(100% - 24px));background:#fff;border:1px solid #dce7e1;border-radius:26px;padding:clamp(22px,5vw,36px);text-align:center;box-shadow:0 18px 50px #12392d16}.brand{font-size:13px;font-weight:850;letter-spacing:.12em;text-transform:uppercase;color:#6a7c74}.card h1{margin:7px 0;font-size:clamp(28px,7vw,40px);letter-spacing:-.04em}.muted{color:#64756d;line-height:1.55}.qr-wrap{display:grid;place-items:center;margin:22px auto;padding:14px;width:min(330px,80vw);aspect-ratio:1;background:#fff;border:1px solid #dce7e1;border-radius:20px;box-shadow:0 12px 35px #12392d12}.qr{display:block;width:100%;height:100%;object-fit:contain}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.btn{border:0;border-radius:13px;padding:14px 16px;background:#12392d;color:#fff;font-weight:800;cursor:pointer}.btn.secondary{background:#edf3f0;color:#12392d}.btn:hover{filter:brightness(.96)}.url{margin-top:16px;padding:11px;border-radius:11px;background:#f4f7f5;font-size:12px;word-break:break-all;color:#64756d}@media(max-width:420px){.actions{grid-template-columns:1fr}.qr-wrap{width:76vw}}</style></head><body><main class="card"><div class="brand">QuickCart</div><h1>Scan to shop</h1><p class="muted">Customers can scan this code to open your storefront instantly.</p><div class="qr-wrap"><img id="img" class="qr" alt="QuickCart store QR code"><div id="status" class="muted">Creating QR code…</div></div><div class="actions"><button class="btn" id="save">Save QR</button><button class="btn secondary" onclick="window.print()">Print</button></div><div id="url" class="url"></div></main><script>
const params=new URLSearchParams(location.search);let target=params.get('url');if(!target){const slug=params.get('slug');if(slug)target=`${location.origin}/store.html?slug=${encodeURIComponent(slug)}`;}const img=document.getElementById('img'),status=document.getElementById('status'),url=document.getElementById('url');
if(!target){status.textContent='No storefront URL was provided.';document.getElementById('save').disabled=true}else{target=decodeURIComponent(target);url.textContent=target;const src='https://quickchart.io/qr?text='+encodeURIComponent(target)+'&size=700&margin=2';img.onload=()=>{status.remove()};img.onerror=()=>{status.textContent='QR service could not create the code. Please try again.'};img.src=src;document.getElementById('save').onclick=()=>{const a=document.createElement('a');a.href=src;a.download='quickcart-store-qr.png';a.target='_blank';a.rel='noopener';a.click()}}
</script></body></html>
