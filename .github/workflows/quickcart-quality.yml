name: QuickCart Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Production build
        run: npm run build

      - name: Validate build output
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -d dist/assets
          test -n "$(find dist/assets -maxdepth 1 -type f -print -quit)"
          grep -Eq 'src="/[^"]*/assets/[^"]+\.js"|src="[^"]*assets/[^"]+\.js"' dist/index.html
          grep -Eq 'href="/[^"]*/assets/[^"]+\.css"|href="[^"]*assets/[^"]+\.css"' dist/index.html
          ! grep -qE 'src="\./(src|assets)/|href="\./(src|assets)/' dist/index.html
          test -f dist/quickcart-logo.svg

      - name: Static JavaScript sanity checks
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(grep -RInE 'console\.log\(|debugger;' src --include='*.js' --include='*.jsx' || true)"
          test -z "$(grep -RInE 'TODO|FIXME|HACK' src --include='*.js' --include='*.jsx' --include='*.css' || true)"
          test -z "$(grep -RInE 'vite\.config\.(ts|tsx)' . --exclude-dir=node_modules --exclude-dir=.git || true)"
