name: Deploy QuickCart to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        env:
          VITE_GITHUB_PAGES: "true"
          VITE_BASE_PATH: "/QuickCart/"
          VITE_API_URL: "https://quickcart-api-f7x7.onrender.com"
        run: npm run build -- --base=/QuickCart/

      - name: Prepare Pages bundle
        run: |
          set -e
          test -s dist/index.html
          test -d dist/assets

          # Copy SEO files explicitly so they are guaranteed to be at the Pages site root.
          cp public/sitemap.xml dist/sitemap.xml
          cp public/robots.txt dist/robots.txt

          test -s dist/sitemap.xml
          test -s dist/robots.txt

          # robots.txt must point to the exact public Pages sitemap.
          grep -Fq "Sitemap: https://ad3n1x.github.io/QuickCart/sitemap.xml" dist/robots.txt

          # Validate sitemap structure and canonical URLs.
          grep -Fq '<?xml version="1.0" encoding="UTF-8"?>' dist/sitemap.xml
          grep -Fq '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">' dist/sitemap.xml
          grep -Fq 'https://ad3n1x.github.io/QuickCart/' dist/sitemap.xml

          cp dist/index.html dist/404.html
          touch dist/.nojekyll
          printf '%s\n' "$GITHUB_SHA" > dist/build-version.txt

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

      # Deployment trigger verification: keep this workflow commit-based.
