name: Deploy QuickCart to GitHub Pages
# Trigger a fresh Pages deployment.
# Store deletion and Create Store modal fix deployment.
# Google sitemap verification enabled.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6
        with:
          node-version: 24

      - name: Check backend JavaScript syntax
        run: |
          node --check api/index.js
          node --check server.js

      - name: Verify app architecture and production invariants
        run: node scripts/verify-project.mjs

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        env:
          VITE_GITHUB_PAGES: "true"
          VITE_BASE_PATH: "/QuickCart/"
          VITE_API_URL: "https://quickcart-api-f7x7.onrender.com"
        run: npm run build -- --base=/QuickCart/

      - name: Prepare Pages bundle
        run: |
          set -e
          test -s dist/index.html
          test -d dist/assets

          cp public/sitemap.xml dist/sitemap.xml
          cp public/robots.txt dist/robots.txt

          test -s dist/sitemap.xml
          test -s dist/robots.txt
          grep -Fq "Sitemap: https://ad3n1x.github.io/QuickCart/sitemap.xml" dist/robots.txt

          # Validate the sitemap as XML before publishing it.
          python3 -c "import xml.etree.ElementTree as ET; ET.parse('dist/sitemap.xml')"
          grep -Fq '<?xml version="1.0" encoding="UTF-8"?>' dist/sitemap.xml
          grep -Fq '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">' dist/sitemap.xml
          grep -Fq 'https://ad3n1x.github.io/QuickCart/' dist/sitemap.xml

          cp dist/index.html dist/404.html
          touch dist/.nojekyll
          printf '%s\n' "$GITHUB_SHA" > dist/build-version.txt

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

      - name: Verify live SEO files
        run: |
          set -e
          for i in {1..12}; do
            sitemap_headers=$(curl -L -sS -D /tmp/sitemap.headers -o /tmp/sitemap.xml -w "%{http_code}" --retry 2 --retry-delay 3 "https://ad3n1x.github.io/QuickCart/sitemap.xml" || true)
            robots_code=$(curl -L -sS -o /tmp/robots.txt -w "%{http_code}" --retry 2 --retry-delay 3 "https://ad3n1x.github.io/QuickCart/robots.txt" || true)
            content_type=$(awk -F': ' 'tolower($1)=="content-type" {print tolower($2)}' /tmp/sitemap.headers | tr -d '\r' | tail -1)

            if [ "$sitemap_headers" = "200" ] && [ "$robots_code" = "200" ] &&                echo "$content_type" | grep -Eq '^(application/xml|text/xml)(;|$)' &&                python3 -c "import xml.etree.ElementTree as ET; ET.parse('/tmp/sitemap.xml')" &&                grep -Fq 'Sitemap: https://ad3n1x.github.io/QuickCart/sitemap.xml' /tmp/robots.txt; then
              echo "GitHub Pages sitemap.xml and robots.txt are live, valid XML, and served with an XML content type."
              exit 0
            fi

            echo "Waiting for GitHub Pages propagation (attempt $i/12): sitemap=$sitemap_headers robots=$robots_code content-type=$content_type"
            sleep 10
          done

          echo "GitHub Pages did not serve a Google-readable sitemap.xml and robots.txt."
          exit 1
