name: Deploy QuickCart to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build GitHub Pages bundle
        env:
          VITE_GITHUB_PAGES: 'true'
          VITE_BASE_PATH: /QuickCart/
        run: npm run build -- --base=/QuickCart/

      - name: Validate published bundle
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.html
          ! grep -Fq '\\n' dist/index.html
          test -d dist/assets
          test -n "$(find dist/assets -maxdepth 1 -type f -print -quit)"
          grep -Eq 'src="/QuickCart/assets/[^"]+\.js"' dist/index.html
          grep -Eq 'href="/QuickCart/assets/[^"]+\.css"' dist/index.html
          ! grep -qE '(src|href)="\\./(src|assets)/' dist/index.html
          test -f dist/quickcart-logo.svg
          cp dist/index.html dist/404.html
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          p = Path('dist/index.html')
          s = p.read_text()
          sha = os.environ['GITHUB_SHA']
          s = re.sub(r"(/QuickCart/assets/[^\"']+\.(?:js|css))(?:\?[^\"']*)?", rf"\1?v={sha}", s)
          p.write_text(s)
          Path('dist/build-version.txt').write_text(sha + '\\n')
          PY
          touch dist/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4


