name: Deploy QuickCart to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'marketing/**'
  workflow_dispatch:
  repository_dispatch:
    types: [deploy-pages]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build GitHub Pages bundle
        env:
          VITE_GITHUB_PAGES: 'true'
          VITE_BASE_PATH: /QuickCart/
        run: npm run build -- --base=/QuickCart/

      - name: Validate published bundle
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.html
          ! grep -Fq '\\n' dist/index.html
          test -d dist/assets
          test -n "$(find dist/assets -maxdepth 1 -type f -print -quit)"
          grep -Eq 'src="/QuickCart/assets/[^"]+\.js"' dist/index.html
          grep -Eq 'href="/QuickCart/assets/[^"]+\.css"' dist/index.html
          ! grep -qE '(src|href)="\./(src|assets)/' dist/index.html
          test -f dist/quickcart-logo.svg
          cp dist/index.html dist/404.html
          # Bust stale browser/CDN asset references on every deployment.
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          p = Path('dist/index.html')
          s = p.read_text()
          sha = os.environ['GITHUB_SHA']
          s = re.sub(r"(/QuickCart/assets/[^\"']+\.(?:js|css))(?:\?[^\"']*)?", rf"\1?v={sha}", s)
          p.write_text(s)
          Path('dist/build-version.txt').write_text(sha + '\n')
          PY
          touch dist/.nojekyll
          echo "Published files:"
          find dist -maxdepth 2 -type f | sort | head -120

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Verify published site
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if curl -fsSL --retry 2 --connect-timeout 10 "https://ad3n1x.github.io/QuickCart/build-version.txt?verify=${GITHUB_SHA}" | grep -Fxq "${GITHUB_SHA}"; then
              echo "GitHub Pages is serving build ${GITHUB_SHA}."
              exit 0
            fi
            echo "Published site has not updated yet (attempt ${attempt}/5)."
            sleep 15
          done
          echo "GitHub Pages did not serve the newly deployed build."
          exit 1

