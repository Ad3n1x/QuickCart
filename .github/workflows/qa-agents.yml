name: QuickCart QA Agent Pipeline

on:
  pull_request:
    branches: [main, implementation/business-os-phase-1]
  push:
    branches: [implementation/business-os-phase-1]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quickcart-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-and-api:
    name: Static checks and API regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Project invariants and syntax
        run: npm run check
      - name: Backend unit and route tests
        run: npm test
      - name: Dependency security summary
        run: |
          npm audit --json > audit.json || true
          node --input-type=module -e '
            import fs from "node:fs";
            const audit = JSON.parse(fs.readFileSync("audit.json", "utf8"));
            const summary = audit.metadata?.vulnerabilities || {};
            console.log("Dependency audit:", JSON.stringify(summary));
            if (summary.critical) process.exitCode = 1;
          '
      - name: Upload dependency audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quickcart-dependency-audit
          path: audit.json
          if-no-files-found: ignore

  browser-and-performance:
    name: Browser, mobile and performance agents
    runs-on: ubuntu-latest
    needs: static-and-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build production frontend
        run: npm run build
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run desktop and mobile browser journeys
        run: npm run test:e2e
      - name: Run bounded local performance smoke test
        run: npm run test:perf
      - name: Upload Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quickcart-playwright-diagnostics
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
