name: Upgrade QuickCart to OTP verification

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  otp-upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch QuickCart OTP verification
        shell: python
        run: |
          from pathlib import Path
          import re

          api = Path('api/index.js')
          s = api.read_text()

          # Replace the Resend email function with a 6-digit OTP email.
          s = re.sub(
              r"async function sendVerificationEmail\(email, name, rawToken\) \{.*?\n\}\n\napp\.get\('/api/_healthcheck'",
              '''async function sendVerificationEmail(email, name, otp) {
            if (!resend) throw new Error('RESEND_API_KEY is not configured.');
            const result = await resend.emails.send({
              from: resendFrom,
              to: [email],
              subject: `${otp} is your QuickCart verification code`,
              html: `
                <div style="font-family:Arial,sans-serif;max-width:560px;margin:0 auto;padding:32px;color:#18231f">
                  <h1 style="margin-bottom:8px">Welcome to QuickCart 👋</h1>
                  <p>Hi ${name || 'there'},</p>
                  <p>Enter this code in QuickCart to verify your email:</p>
                  <div style="font-size:36px;font-weight:800;letter-spacing:10px;padding:20px 0;color:#12392d">${otp}</div>
                  <p style="font-size:13px;color:#66716c">This code expires in 10 minutes. Never share it with anyone.</p>
                </div>
              `
            });
            if (result.error) throw new Error(result.error.message || 'Unable to send verification email.');
          }

          app.get('/api/_healthcheck' ''',
              s,
              flags=re.S
          )

          # Signup now creates a 6-digit OTP, stores only its hash, and emails the code.
          s = s.replace(
              "const rawToken = randomBytes(32).toString('hex');\n    const user = {",
              "const otp = String(Math.floor(100000 + Math.random() * 900000));\n    const user = {"
          )
          s = s.replace(
              "emailVerificationTokenHash: hashToken(rawToken),\n      emailVerificationExpiresAt: new Date(Date.now() + 24 * 60 * 60 * 1000),",
              "emailVerificationOtpHash: hashToken(otp),\n      emailVerificationOtpExpiresAt: new Date(Date.now() + 10 * 60 * 1000),\n      emailVerificationOtpAttempts: 0,"
          )
          s = s.replace(
              "await sendVerificationEmail(email, name, rawToken);",
              "await sendVerificationEmail(email, name, otp);"
          )
          s = s.replace(
              "res.status(201).json({ message: 'Account created. Check your email to verify your account.' });",
              "res.status(201).json({ message: 'Account created. Enter the verification code sent to your email.', email });"
          )

          # Add the OTP verification route before login.
          marker = "app.post('/api/auth/login', async (req, res) => {"
          otp_routes = r'''app.post('/api/auth/verify-otp', async (req, res) => {
            try {
              const email = String(req.body.email || '').trim().toLowerCase();
              const otp = String(req.body.otp || '').trim();
              if (!email || !/^\d{6}$/.test(otp)) return res.status(400).json({ error: 'Enter the 6-digit verification code.' });

              const database = await db();
              const users = database.collection('users');
              const user = await users.findOne({ email });
              if (!user) return res.status(404).json({ error: 'Account not found.' });
              if (user.emailVerified) return res.status(400).json({ error: 'This email is already verified.' });
              if (!user.emailVerificationOtpExpiresAt || new Date(user.emailVerificationOtpExpiresAt) <= new Date()) {
                return res.status(400).json({ error: 'This code has expired. Request a new code.' });
              }
              if ((user.emailVerificationOtpAttempts || 0) >= 5) {
                return res.status(429).json({ error: 'Too many incorrect attempts. Request a new code.' });
              }
              if (hashToken(otp) !== user.emailVerificationOtpHash) {
                await users.updateOne({ id: user.id }, { $inc: { emailVerificationOtpAttempts: 1 } });
                return res.status(400).json({ error: 'Incorrect verification code.' });
              }

              await users.updateOne(
                { id: user.id },
                { $set: { emailVerified: true, verifiedAt: now() }, $unset: { emailVerificationOtpHash: '', emailVerificationOtpExpiresAt: '', emailVerificationOtpAttempts: '' } }
              );

              const updatedUser = { ...user, emailVerified: true };
              const { passwordHash, emailVerificationOtpHash, emailVerificationOtpExpiresAt, emailVerificationOtpAttempts, ...safeUser } = updatedUser;
              res.json({ message: 'Email verified successfully.', user: safeUser, token: tokenFor(updatedUser) });
            } catch (error) {
              console.error(error);
              res.status(500).json({ error: 'Unable to verify email.' });
            }
          });

          app.post('/api/auth/resend-otp', async (req, res) => {
            try {
              const email = String(req.body.email || '').trim().toLowerCase();
              if (!email) return res.status(400).json({ error: 'Email is required.' });
              const database = await db();
              const users = database.collection('users');
              const user = await users.findOne({ email });
              if (!user) return res.status(404).json({ error: 'No account was found with that email.' });
              if (user.emailVerified) return res.status(400).json({ error: 'That email is already verified.' });
              const otp = String(Math.floor(100000 + Math.random() * 900000));
              await users.updateOne(
                { id: user.id },
                { $set: { emailVerificationOtpHash: hashToken(otp), emailVerificationOtpExpiresAt: new Date(Date.now() + 10 * 60 * 1000), emailVerificationOtpAttempts: 0 } }
              );
              await sendVerificationEmail(user.email, user.name, otp);
              res.json({ message: 'A new verification code has been sent.' });
            } catch (error) {
              console.error(error);
              res.status(500).json({ error: error.message || 'Unable to resend verification code.' });
            }
          });

          ''' + marker
          if "app.post('/api/auth/verify-otp'" not in s:
              s = s.replace(marker, otp_routes, 1)

          api.write_text(s)

          # Frontend: open a dedicated OTP screen immediately after signup.
          app = Path('src/App.jsx')
          s = app.read_text()
          s = s.replace(
              "const [verificationState, setVerificationState] = useState(null);",
              "const [verificationState, setVerificationState] = useState(null);\n  const [otpOpen, setOtpOpen] = useState(false), [otpEmail, setOtpEmail] = useState(''), [otpCode, setOtpCode] = useState(''), [otpError, setOtpError] = useState(''), [otpBusy, setOtpBusy] = useState(false);"
          )
          old_signup = """if (authMode === 'signup') {
        setAuthOpen(false);
        setAuthError('');
        alert(data.message || 'Check your email to verify your account.');
        setAuthMode('login');
        return;
      }"""
          new_signup = """if (authMode === 'signup') {
        setAuthOpen(false);
        setAuthError('');
        setOtpEmail(data.email || authForm.email);
        setOtpCode('');
        setOtpError('');
        setOtpOpen(true);
        return;
      }"""
          s = s.replace(old_signup, new_signup)

          anchor = "  const signOut = () =>"
          handler = """  const verifyOtp = async e => {
    e.preventDefault(); setOtpError(''); setOtpBusy(true);
    try {
      const data = await api('/api/auth/verify-otp', { method: 'POST', body: JSON.stringify({ email: otpEmail, otp: otpCode }) });
      localStorage.setItem('quickcart_token', data.token);
      setOtpOpen(false); setUser(data.user); await loadPrivate();
    } catch (error) { setOtpError(error.message); }
    finally { setOtpBusy(false); }
  };

  const resendOtp = async () => {
    setOtpError(''); setOtpBusy(true);
    try { await api('/api/auth/resend-otp', { method: 'POST', body: JSON.stringify({ email: otpEmail }) }); setOtpError('A new code has been sent.'); }
    catch (error) { setOtpError(error.message); }
    finally { setOtpBusy(false); }
  };

""" + anchor
          if "const verifyOtp = async e" not in s:
              s = s.replace(anchor, handler, 1)

          render_anchor = "  if (verifyMatch) return <VerifyEmail state={verificationState} />;"
          otp_render = "  if (otpOpen && !user) return <OtpScreen email={otpEmail} code={otpCode} setCode={setOtpCode} error={otpError} busy={otpBusy} onVerify={verifyOtp} onResend={resendOtp} onBack={() => { setOtpOpen(false); setAuthOpen(true); }} />;\n" + render_anchor
          s = s.replace(render_anchor, otp_render, 1)

          component_anchor = "function Landing({ openAuth"
          component = r'''function OtpScreen({ email, code, setCode, error, busy, onVerify, onResend, onBack }) {
            return <main className="landing"><div className="landing-nav"><div className="brand"><span className="brand-mark">Q</span> QuickCart</div></div><section className="otp-screen"><div className="panel otp-card"><div className="otp-icon">✉</div><span className="eyebrow-dark">EMAIL VERIFICATION</span><h1>Enter your <span>6-digit code.</span></h1><p>We sent a verification code to <strong>{email}</strong>. It expires in 10 minutes.</p><form onSubmit={onVerify}><input className="otp-input" inputMode="numeric" autoComplete="one-time-code" maxLength="6" pattern="[0-9]{6}" placeholder="000000" value={code} onChange={e => setCode(e.target.value.replace(/\D/g, '').slice(0, 6))} autoFocus required /><button className="primary big" type="submit" disabled={busy || code.length !== 6}>{busy ? 'Checking…' : 'Verify email'}</button></form>{error && <div className={error.startsWith('A new code') ? 'success' : 'error'}>{error}</div>}<button className="link-btn" type="button" onClick={onResend} disabled={busy}>Resend code</button><button className="link-btn muted" type="button" onClick={onBack} disabled={busy}>Use a different email</button></div></section></main>;
          }

          ''' + component_anchor
          if "function OtpScreen({ email" not in s:
              s = s.replace(component_anchor, component, 1)
          app.write_text(s)

          css = Path('src/index.css')
          c = css.read_text()
          c += """\n.otp-screen{min-height:70vh;display:grid;place-items:center;padding:30px 18px}.otp-card{width:min(460px,100%);padding:34px;text-align:center}.otp-icon{width:56px;height:56px;border-radius:18px;background:#eaf3ee;display:grid;place-items:center;margin:0 auto 16px;font-size:26px}.otp-card h1{font-size:34px;letter-spacing:-.05em;margin:8px 0}.otp-card h1 span{color:#4f806b}.otp-card p{color:#718079;line-height:1.6}.otp-input{width:100%;box-sizing:border-box;text-align:center;letter-spacing:12px;font-size:28px;font-weight:800;padding:15px 12px;border:1px solid #dce6e0;border-radius:12px;margin:16px 0;outline:none}.otp-input:focus{border-color:#12392d;box-shadow:0 0 0 3px #12392d18}.success{margin-top:12px;padding:10px;border-radius:10px;background:#e9f8ef;color:#256044}.muted{color:#718079}\n"""
          css.write_text(c)

      - name: Commit OTP upgrade
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/index.js src/App.jsx src/index.css
          if git diff --cached --quiet; then
            echo "No OTP changes needed"
            exit 0
          fi
          git commit -m "Add Resend email OTP verification screen"
          git push
