name: QuickCart refactor checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [refactor/modular-mern-structure]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check server modules and project invariants
        run: npm run check
      - name: Build frontend
        run: npm run build
